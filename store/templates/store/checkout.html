{% extends 'store/base.html' %}

{% block title %}
Checkout | CoverX
{% endblock %}

{% block content %}

<div class="checkout-container">

    <div class="checkout-left">

        <h2>Delivery Address</h2>

        <form method="POST">
    {% csrf_token %}

    <input type="text"
           name="name"
           placeholder="Full Name"
           required>

    <input type="email"
           name="email"
           placeholder="Email Address"
           required>

    <input type="text"
           name="phone"
           placeholder="Phone Number"
           required>

    <textarea
        name="address"
        placeholder="Complete Address"
        required></textarea>

    <input type="text"
           name="city"
           placeholder="City"
           required>

    <input type="text"
           name="state"
           placeholder="State"
           required>

    <input type="text"
           name="pincode"
           placeholder="PIN Code"
           required>
 <div class="checkout-right">
    <h3>Select Payment Method</h3>

    <label>
    <input type="radio"
           name="payment_method"
           value="Cash on Delivery"
           checked>
    Cash on Delivery
    </label>

    <br>

    <label>
    <input type="radio"
           name="payment_method"
           value="UPI">
    UPI
    </label>

    <br>

    <label>
    <input type="radio"
           name="payment_method"
           value="Credit/Debit Card">
    Credit / Debit Card
    </label>

    <br><br>

    <button type="submit" class="place-order">
    Place Order
    </button>

 </div>
    </form>

    </div>

    <!--div class="checkout-right">

        <h2>Order Summary</h2>

        <h3>Total : ₹{{ grand_total }}</h3>

    </div>

</div>

{% endblock %}
