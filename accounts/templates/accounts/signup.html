{% extends "store/base.html" %}

{% block title %}
Sign Up | CaseX
{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>Create Account</h1>

        <p>Join CaseX and start shopping premium iPhone cases.</p>

        <form method="POST">

            {% csrf_token %}

            <input
                type="text"
                name="username"
                placeholder="Username"
                required>

            <input
                type="email"
                name="email"
                placeholder="Email Address"
                required>

            <input
                type="password"
                name="password1"
                placeholder="Password"
                required>

            <input
                type="password"
                name="password2"
                placeholder="Confirm Password"
                required>

            <button type="submit">
                Create Account
            </button>

        </form>

        <div class="auth-footer">

            Already have an account?

            <a href="{% url 'login' %}">
                Login
            </a>

        </div>

    </div>

</div>

{% endblock %}
